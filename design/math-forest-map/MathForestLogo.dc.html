<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />
</helmet>
<div style="position:relative;display:inline-block;filter:drop-shadow(0 8px 10px rgba(20,40,10,.4))">
  <div style="position:absolute;top:-12px;left:6px;width:34px;height:26px;background:radial-gradient(120% 120% at 30% 25%,#8ed63f,#3f9412);border-radius:70% 20% 60% 25%;transform:rotate(-18deg)"></div>
  <div style="position:absolute;top:-14px;right:10px;width:30px;height:24px;background:radial-gradient(120% 120% at 30% 25%,#9ede52,#46a015);border-radius:25% 65% 20% 70%;transform:rotate(14deg)"></div>
  <div style="position:absolute;bottom:-10px;right:-8px;width:28px;height:22px;background:radial-gradient(120% 120% at 30% 25%,#8ed63f,#3a8a10);border-radius:60% 25% 65% 20%;transform:rotate(26deg)"></div>
  <div style="position:relative;padding:12px 22px 14px;border-radius:22px;background:linear-gradient(175deg,#a9702f 0%,#8c5620 42%,#6f4118 100%);box-shadow:inset 0 3px 0 rgba(255,220,160,.45),inset 0 -5px 0 rgba(60,30,8,.5),0 0 0 5px #5d3714,0 0 0 8px #a9702f">
    <div style="position:absolute;inset:6px;border-radius:16px;box-shadow:inset 0 0 0 2px rgba(90,52,20,.55)"></div>
    <div style="position:absolute;top:10px;left:10px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a8,#9a6a22)"></div>
    <div style="position:absolute;bottom:10px;right:10px;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe6a8,#9a6a22)"></div>
    <div style="font-family:'Titan One',system-ui;font-size:38px;line-height:.92;color:#ffd73f;text-align:center;letter-spacing:.01em;text-shadow:0 3px 0 #7a4410,-2px 0 0 #7a4410,2px 0 0 #7a4410,0 -2px 0 #7a4410,0 6px 8px rgba(0,0,0,.35)">Math</div>
    <div style="font-family:'Titan One',system-ui;font-size:30px;line-height:1.05;color:#fffdf6;text-align:center;text-shadow:0 3px 0 #7a4410,-2px 0 0 #7a4410,2px 0 0 #7a4410,0 -2px 0 #7a4410,0 6px 8px rgba(0,0,0,.3)">Forest</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:180}}"></script>
</body>
</html>
